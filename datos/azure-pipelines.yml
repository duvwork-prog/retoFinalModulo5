trigger:
  - main

pr:
  - main

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: BuildJob
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Use Node.js 20
            inputs:
              versionSpec: '20.x'

          - script: npm ci
            displayName: Install dependencies

          - script: node scripts/build-check.js
            displayName: Build validation

  - stage: SmokeTests
    displayName: SmokeTests
    dependsOn: Build
    jobs:
      - job: SmokeJob
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Use Node.js 20
            inputs:
              versionSpec: '20.x'

          - script: npm ci
            displayName: Install dependencies

          - script: npm run smoke
            displayName: Smoke tests (health + catalog + create order)

  - stage: LoadTest
    displayName: LoadTest
    dependsOn: SmokeTests
    jobs:
      - job: LoadGateJob
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Use Node.js 20
            inputs:
              versionSpec: '20.x'

          - script: npm ci
            displayName: Install dependencies

          - script: npm run load
            displayName: Quality gate - load test (p95 < 800 ms and errors < 1%)
            env:
              SLA_P95_MS: '800'
              SLA_ERROR_RATE: '0.01'
