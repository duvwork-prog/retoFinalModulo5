# Azure Pipelines para app-tienda
# Origen del código: Azure DevOps > Pipelines > New pipeline > GitHub > seleccionar el repositorio que contenga esta carpeta.

trigger:
  - main

pr:
  - main

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: BuildJob
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Use Node.js 20
            inputs:
              versionSpec: '20.x'

          - script: |
              cd $(Build.SourcesDirectory)/app-tienda
              npm ci
              node datos/generar-datos.js
            displayName: Build gate - install dependencies and generate data

  - stage: SmokeTests
    displayName: SmokeTests
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: SmokeJob
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Use Node.js 20
            inputs:
              versionSpec: '20.x'

          - script: |
              cd $(Build.SourcesDirectory)/app-tienda
              npm ci
              nohup npm start > app.log 2>&1 &
              for i in {1..30}; do
                curl -fsS http://localhost:3000/api/health >/dev/null && break
                sleep 2
              done
              node tests/smoke-api.js
            displayName: Smoke gate - health, catalog and create order
            env:
              BASE_URL: http://localhost:3000

  - stage: LoadTest
    displayName: LoadTest
    dependsOn: SmokeTests
    condition: succeeded()
    jobs:
      - job: LoadGateJob
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Use Node.js 20
            inputs:
              versionSpec: '20.x'

          - script: |
              cd $(Build.SourcesDirectory)/app-tienda
              npm ci
              nohup npm start > app.log 2>&1 &
              for i in {1..30}; do
                curl -fsS http://localhost:3000/api/health >/dev/null && break
                sleep 2
              done
              node tests/carga-simple.js
            displayName: Load gate - p95 < 800 ms and errors < 1%
            env:
              BASE_URL: http://localhost:3000
              CONCURRENCIA: '20'
              DURACION_S: '6'
              SLA_P95_MS: '800'
              SLA_ERROR_PCT: '1'

  - stage: CloudE2E
    displayName: CloudE2E
    dependsOn: LoadTest
    condition: succeeded()
    jobs:
      - job: SauceLabsE2E
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            displayName: Use Python 3.12
            inputs:
              versionSpec: '3.12'

          - script: |
              cd $(Build.SourcesDirectory)/e2e
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              python -m playwright install chromium
            displayName: Install E2E dependencies

          - script: |
              cd $(Build.SourcesDirectory)/e2e
              export BASE_URL="$(BASE_URL_CLOUD)"
              export PLAYWRIGHT_BROWSER_NAME="chromium"
              export PLAYWRIGHT_REMOTE_WS="$(PLAYWRIGHT_REMOTE_WS)"
              pytest -q --maxfail=1
            displayName: Run E2E tests against remote browser
            env:
              BASE_URL_CLOUD: $(BASE_URL_CLOUD)
              PLAYWRIGHT_REMOTE_WS: $(PLAYWRIGHT_REMOTE_WS)
              SAUCE_USERNAME: $(SAUCE_USERNAME)
              SAUCE_ACCESS_KEY: $(SAUCE_ACCESS_KEY)
              SAUCE_REGION: $(SAUCE_REGION)

  - stage: Deploy
    displayName: Deploy
    dependsOn: CloudE2E
    condition: succeeded()
    jobs:
      - job: DeployJob
        pool:
          vmImage: ubuntu-latest
        steps:
          - bash: |
              echo "Deploy gate passed: Build, SmokeTests, LoadTest and CloudE2E succeeded."
              echo "Deployment step would run here."
            displayName: Deployment gate
